name: Update Profile Stats

on:
  workflow_dispatch:
  schedule:
    - cron: "17 */6 * * *"
  push:
    branches:
      - main
    paths:
      - README.md
      - .github/workflows/update-readme-stats-year.yml
      - scripts/update_external_contributions.py
      - tests/**

concurrency:
  group: profile-stats-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  update-stats:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify stats updater
        run: python3 -B -m unittest discover -s tests -v

      - name: Update current-year README stats
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          export CURRENT_YEAR="$(date -u +%Y)"
          export GITHUB_LOGIN="Boulea7"
          python3 - <<'PY'
          import json
          import os
          import re
          import urllib.request
          from pathlib import Path

          readme_path = Path("README.md")
          content = readme_path.read_text(encoding="utf-8")
          current_year = os.environ["CURRENT_YEAR"]
          github_login = os.environ["GITHUB_LOGIN"]
          github_token = os.environ["GITHUB_TOKEN"]

          year_start = f"{current_year}-01-01T00:00:00Z"
          year_end = f"{current_year}-12-31T23:59:59Z"

          query = """
          query($login:String!,$from:DateTime!,$to:DateTime!,$issueAfter:String,$prAfter:String,$reviewAfter:String,$repoAfter:String){
            user(login:$login){
              contributionsCollection(from:$from, to:$to){
                totalRepositoriesWithContributedCommits
                commitContributionsByRepository(maxRepositories:100){
                  repository { nameWithOwner }
                }
                issueContributions(first:100, after:$issueAfter){
                  nodes { issue { repository { nameWithOwner } } }
                  pageInfo { hasNextPage endCursor }
                }
                pullRequestContributions(first:100, after:$prAfter){
                  nodes { pullRequest { repository { nameWithOwner } } }
                  pageInfo { hasNextPage endCursor }
                }
                pullRequestReviewContributions(first:100, after:$reviewAfter){
                  nodes { pullRequest { repository { nameWithOwner } } }
                  pageInfo { hasNextPage endCursor }
                }
                repositoryContributions(first:100, after:$repoAfter){
                  nodes { repository { nameWithOwner } }
                  pageInfo { hasNextPage endCursor }
                }
              }
            }
          }
          """

          def run_query(variables):
              request = urllib.request.Request(
                  "https://api.github.com/graphql",
                  data=json.dumps({"query": query, "variables": variables}).encode("utf-8"),
                  headers={
                      "Authorization": f"Bearer {github_token}",
                      "Content-Type": "application/json",
                      "Accept": "application/vnd.github+json",
                  },
                  method="POST",
              )
              with urllib.request.urlopen(request, timeout=30) as response:
                  payload = json.loads(response.read().decode("utf-8"))
              if "errors" in payload:
                  raise SystemExit("GitHub GraphQL query failed for annual contributions.")
              return payload["data"]["user"]["contributionsCollection"]

          repos = set()
          cursors = {
              "issueAfter": None,
              "prAfter": None,
              "reviewAfter": None,
              "repoAfter": None,
          }
          commit_loaded = False
          connections = {
              "issueAfter": ("issueContributions", "issue"),
              "prAfter": ("pullRequestContributions", "pullRequest"),
              "reviewAfter": ("pullRequestReviewContributions", "pullRequest"),
              "repoAfter": ("repositoryContributions", None),
          }
          finished = set()
          seen_cursors = {key: set() for key in connections}

          for _ in range(1000):
              collection = run_query(
                  {
                      "login": github_login,
                      "from": year_start,
                      "to": year_end,
                      **cursors,
                  }
              )

              if not commit_loaded:
                  commit_repos = collection["commitContributionsByRepository"]
                  if collection["totalRepositoriesWithContributedCommits"] > len(commit_repos):
                      raise SystemExit("Annual commit repository list is incomplete; keeping previous stats.")
                  for item in commit_repos:
                      repos.add(item["repository"]["nameWithOwner"])
                  commit_loaded = True

              for cursor_key, (connection_name, nested_key) in connections.items():
                  if cursor_key in finished:
                      continue
                  connection = collection[connection_name]
                  for item in connection["nodes"]:
                      contribution = item[nested_key] if nested_key else item
                      repos.add(contribution["repository"]["nameWithOwner"])
                  page_info = connection["pageInfo"]
                  if not page_info["hasNextPage"]:
                      finished.add(cursor_key)
                      continue
                  next_cursor = page_info["endCursor"]
                  if not isinstance(next_cursor, str) or not next_cursor or next_cursor in seen_cursors[cursor_key]:
                      raise SystemExit("Annual contribution pagination cursor did not advance.")
                  seen_cursors[cursor_key].add(next_cursor)
                  cursors[cursor_key] = next_cursor

              if len(finished) == len(connections):
                  break
          else:
              raise SystemExit("Annual contribution pagination exceeded its safety limit.")

          stats_pattern = re.compile(r'(github-readme-stats\.vercel\.app/api\?username=Boulea7[^"\n]*)')
          if not stats_pattern.search(content):
              raise SystemExit("GitHub stats card URL not found in README.md")

          def update_stats_url(match):
              stats_url = match.group(1)
              if "commits_year=" in stats_url:
                  stats_url = re.sub(r"commits_year=\d{4}", f"commits_year={current_year}", stats_url, count=1)
              else:
                  stats_url = f"{stats_url}&commits_year={current_year}"
              if "cache_seconds=" not in stats_url:
                  stats_url = f"{stats_url}&cache_seconds=21600"
              return stats_url

          contrib_badge = (
              f"https://img.shields.io/badge/Contributed%20to%20%28{current_year}%29-"
              f"{len(repos)}%20repos-D4A017?style=flat-square"
          )
          contrib_alt = f"Contributed to {len(repos)} repositories in {current_year}"

          badge_pattern = re.compile(
              r'<img src="https://img\.shields\.io/badge/Contributed%20to%20%28\d{4}%29-[^"]+" alt="Contributed to \d+ repositories in \d{4}" />'
          )
          badge_replacement = f'<img src="{contrib_badge}" alt="{contrib_alt}" />'
          if badge_pattern.search(content):
              updated_content = badge_pattern.sub(badge_replacement, content, count=1)
          else:
              insert_anchor = '<br/>\n\n<img src="https://streak-stats.demolab.com'
              if insert_anchor not in content:
                  raise SystemExit("Contribution badge insertion point not found in README.md")
              updated_content = content.replace(
                  insert_anchor,
                  f'<br/>\n\n{badge_replacement}\n\n<br/>\n\n<img src="https://streak-stats.demolab.com',
                  1,
              )

          updated_content = stats_pattern.sub(update_stats_url, updated_content)

          if updated_content != content:
              readme_path.write_text(updated_content, encoding="utf-8")
          PY

      - name: Update all-time external contributions
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_LOGIN: Boulea7
        run: python3 -B scripts/update_external_contributions.py

      - name: Commit changes
        run: |
          git add -- README.md assets/external-contributions-light.svg assets/external-contributions-dark.svg
          if git diff --cached --quiet; then
            echo "No profile stats update needed."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "ci: refresh profile stats"
          git push
